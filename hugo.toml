# ─────────────────────────────────────────────────────────────────────────
# ufl — Ukrainian as a Foreign Language (boulingua course, Hugo + hugo-coder).
#
# Instantiated from `pagegen`. Only the values the template marks as
# per-course are changed here; everything else is the shared standard and
# must stay in step with pagegen.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/ufl/"
title = "Ukrainian — S. Le Boulanger"
languageCode = "uk"
defaultContentLanguage = "uk"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Українська"
  author = "S. Le Boulanger"
  description = "A free Ukrainian course: Cyrillic script onboarding, then CEFR A1 to B1 — units, exams, printable materials and native-voice audio."
  keywords = "Ukrainian,Ukrainian language,Cyrillic,CEFR,curriculum,OER"
  dateFormat = "2006-01-02"
  since = 2025
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent (#C723A1) from data/accents.yaml.
  code = "ufl"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Cookieless analytics on the author's self-hosted instance (server in
    # Germany), matching the sister courses and the /datenschutz/ disclosure.
    domain = "boulingua.github.io/ufl"
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/ufl"

